---
- name: Deploy Django App via Docker
  hosts: webservers
  become: yes
  serial: 1

  tasks:
    - name: Install Docker
      ansible.builtin.apt:
        name: docker.io
        state: present
        update_cache: yes

    - name: Ensure Docker service is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: yes

    - name: Create project directory on server
      ansible.builtin.file:
        path: /home/ubuntu/web_code
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copy project files to server
      ansible.builtin.copy:
        src: ../.           # <--- The dot is crucial. It copies contents, not the folder.
        dest: /home/ubuntu/web_code/
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Stop existing container (if any)
      community.docker.docker_container:
        name: my-django-app
        state: absent
      ignore_errors: yes

    - name: Build Docker image from Dockerfile
      community.docker.docker_image:
        name: my-django-app
        source: build
        build:
          path: /home/ubuntu/web_code  # <--- Exact same path as the copy destination
          dockerfile: Dockerfile
        state: present
        force_source: yes

    - name: Run the Django container
      community.docker.docker_container:
        name: my-django-app
        image: my-django-app
        state: started
        restart_policy: always
        ports:
          - "8000:8000"
        detach: yes