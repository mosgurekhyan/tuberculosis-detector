name: Deploy Django App via Ansible

on:
  push:
    branches: [ "main" ] # Triggers when you push to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible
          # If your playbook uses docker-related modules, you need to install the collection
          ansible-galaxy collection install community.docker

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Optional: Add host fingerprint of target servers to avoid verification issues
          ssh-keyscan -H 18.195.78.186 >> ~/.ssh/known_hosts
          ssh-keyscan -H 63.186.90.99 >> ~/.ssh/known_hosts

      - name: Run Ansible Playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: ${{ secrets.ANSIBLE_HOST_KEY_CHECKING }}
        run: |
          # Note: Inventory file uses the key path in your local computer, CI environment doesn't have this path, 
          # it's recommended to temporarily remove ansible_ssh_private_key_file from inventory, or override it via command line.
          # Here we assume you have removed that line from inventory.ini (because ~/.ssh/id_rsa is already the default key).
          ansible-playbook -i ansible/inventory.ini ansible/playbook.yml
