name: Deploy Django App via Ansible

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:  # Allows you to manually trigger from GitHub UI

jobs:
  deploy:
    name: Build & Deploy to AWS Instances
    runs-on: ubuntu-latest

    steps:
      # 1. Pull the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Python for Ansible
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. Install Ansible and required collections
      - name: Install Ansible & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible
          ansible-galaxy collection install community.docker

      # 4. Configure SSH private key for Ansible to log into AWS EC2
      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Pre-accept host fingerprints for both EC2 servers
          ssh-keyscan -H ${{ secrets.SERVER1_IP }} >> ~/.ssh/known_hosts
          ssh-keyscan -H ${{ secrets.SERVER2_IP }} >> ~/.ssh/known_hosts

      # 5. Generate inventory.ini dynamically from secrets
      - name: Generate Ansible Inventory
        run: |
          mkdir -p ansible
          cat > ansible/inventory.ini <<EOF
          [webservers]
          server1 ansible_host=${{ secrets.SERVER1_IP }}
          server2 ansible_host=${{ secrets.SERVER2_IP }}

          [webservers:vars]
          ansible_user=ubuntu
          ansible_python_interpreter=/usr/bin/python3
          EOF
          echo "----- Generated inventory.ini -----"
          cat ansible/inventory.ini

      # 6. Run the Ansible playbook
      - name: Run Ansible Playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_FORCE_COLOR: "1"
        run: |
          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/playbook.yml \
            --extra-vars "lb_dns_name=${{ secrets.LB_DNS_NAME }}"
